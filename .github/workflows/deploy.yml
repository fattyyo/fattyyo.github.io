name: Deploy to GitHub Pages

# 網站結構：fattyyo.com/ = 作品集（fattyyo/portfolio repo），fattyyo.com/blog/ = 這個 Hugo 部落格
on:
  push:
    branches: [main]
  workflow_dispatch:          # 作品集更新後手動觸發：gh workflow run deploy.yml -R fattyyo/fattyyo.github.io
  schedule:
    - cron: "0 9 * * *"       # 每天一次，保險起見把作品集的最新版帶上來

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          repository: fattyyo/portfolio
          path: _portfolio

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build blog
        run: hugo --minify -d public/blog

      - name: Add portfolio and root 404
        run: python3 .github/scripts/assemble.py _portfolio public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
